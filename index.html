<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novamind AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; height: 90vh; }
        h1 { text-align: center; color: #38bdf8; font-size: 24px; }
        #chat-box { flex: 1; background: #1e293b; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #334155; }
        .message { margin-bottom: 12px; line-height: 1.5; }
        .user { color: #38bdf8; font-weight: bold; }
        .ai { color: #4ade80; font-weight: bold; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
        button { padding: 12px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Novamind AI Assistant</h1>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Yahan apna sawal likhein..." onkeypress="if(event.key === 'Y' || event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Bhejein</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message"><span class="user">Aap:</span> ${text}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                if (data.reply) {
                    chatBox.innerHTML += `<div class="message"><span class="ai">Novamind:</span> ${data.reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message" style="color:red;">Error: ${data.error || 'Kuch galat ho gaya'}</div>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<div class="message" style="color:red;">Network Error!</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
